apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: local-llm-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: local-llm-k8s/gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: llm-config
          # Optional shared token. Present only when created by `make up`;
          # the gateway runs without it by default (local demo).
          env:
            - name: GATEWAY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-secret
                  key: token
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            # Sized for a 4 vCPU VM shared with Ollama: small request so the HPA
            # has headroom to measure utilization, hard cap so 4 replicas fit.
            requests:
              # Measured: at 50 concurrent clients this pod burns 10-16m CPU,
              # because it is waiting on Ollama, not computing. A 50m request
              # makes the HPA's utilisation signal track load (see gateway-hpa).
              cpu: "50m"
              memory: 96Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
