apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-config
  labels:
    app.kubernetes.io/part-of: local-llm-k8s
data:
  # Model served by Ollama. Small on purpose: this box has no GPU.
  OLLAMA_MODEL: "qwen2.5:0.5b-instruct"
  # Absolute URL the gateway uses to reach Ollama through its Service.
  OLLAMA_URL: "http://ollama:11434"
  OLLAMA_KEEP_ALIVE: "-1"
  OLLAMA_NUM_PARALLEL: "4"
  OLLAMA_MAX_LOADED_MODELS: "1"
  # Gateway request budget. CPU inference is slow: give it room, then fail fast.
  REQUEST_TIMEOUT_S: "120"
  DEFAULT_MAX_TOKENS: "128"
  LOG_LEVEL: "INFO"
