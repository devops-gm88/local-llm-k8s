apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
# CI overlay: same manifests as the real cluster, with the model replaced by a
# deterministic mock and images loaded straight into kind.
resources:
  - ../base
images:
  - name: local-llm-k8s/gateway
    newTag: ci
patches:
  - target:
      kind: Deployment
      name: ollama
    path: mock-ollama-patch.yaml
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
