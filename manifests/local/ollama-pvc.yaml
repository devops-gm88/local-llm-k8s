apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: local-llm-k8s
spec:
  accessModes: ["ReadWriteOnce"]
  # k3s ships the local-path provisioner; the volume lives on the node disk.
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
